; GeekMagic SmallTV Ultra (ESP-12F / ESP8266, ST7789 240x240)
; See README.md for setup. Build, flash, then enable wireless updates (ota.ini).

[platformio]
; Wireless-update settings (with your OTA password) live in ota.ini, which is
; git-ignored. Copy ota.example.ini to ota.ini after the first flash - see README Part 2.
; Until ota.ini exists, uploads use USB serial.
extra_configs = ota.ini

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  tzapu/WiFiManager@^2.0.17
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=1
  -D LOAD_GFXFF=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
