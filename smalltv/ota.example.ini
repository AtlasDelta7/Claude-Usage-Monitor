; Wireless (OTA) upload settings.
; Copy this file to ota.ini (same folder) and put your OTA_PASS from src/secrets.h
; after --auth=. ota.ini is git-ignored, so your password never gets committed.
; Keep the indentation exactly as shown: only the two --flags lines are indented.
[env:smalltv]
upload_protocol = espota
upload_port = smalltv.local
upload_flags =
  --auth=YOUR_OTA_PASS
  --host_port=8270
